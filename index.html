<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOK browswer</title>

    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <header>         
        <h1>Book Browser</h1>         
        <p>Search the shelf, filter by genre, and click any book for details.</p>     
    </header>     
        
        
   <main>          
    <section class="controls">
        <input type="text" class="search-input js-searchInput" placeholder="Search by title..."> /*--search box--*/

        <section class="js-ratingSelect">
            <option value="" class="value"></option>
            <option value="" class="value"></option>
            <option value="" class="value"></option>
        </section> /*--rating filter--*/

        <button class="js-clratButtoon">Clear all</button>

        <div class="genre-button js-genreButtons"></div>
    </section>   
    
    <p class="js-resultsText"></p> /*---show the match book --*/

    <section class="book-list js-booDetails"></section>

    <section class="book-detail js-bookDetails"></section>

   </main>

   <footer>
    <p>&copy; Richard Spires Project: book browser</p>
   </footer>

   <script src="./js/app.js"></script>
</body>
</html>
